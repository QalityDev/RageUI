<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RageUI Standalone Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="rageui-container" class="rageui-menu-container" style="display: none;">
        <div class="rageui-header">
            <h1 id="rageui-title">RageUI</h1>
            <div id="rageui-subtitle-bar" class="rageui-subtitle-bar">
                <span id="rageui-subtitle">MENU</span>
                <span id="rageui-counter" class="rageui-counter">1/1</span>
            </div>
        </div>
        <div id="rageui-items" class="rageui-items"></div>
        <div id="rageui-footer" class="rageui-footer" style="display: none;">
            <p id="rageui-description"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

    <div id="golf-leaderboard" role="dialog" aria-modal="true" aria-labelledby="golf-leaderboard-title" hidden>

                <div class="ds-digit"><span style="--index:0">0</span><span style="--index:1">1</span><span style="--index:2">2</span><span style="--index:3">3</span><span style="--index:4">4</span><span style="--index:5">5</span><span style="--index:6">6</span><span style="--index:7">7</span><span style="--index:8">8</span><span style="--index:9">9</span></div>

                <span class="ds-spacer">:</span>
                <div class="ds-digit"><span style="--index:0">0</span><span style="--index:1">1</span><span style="--index:2">2</span><span style="--index:3">3</span><span style="--index:4">4</span><span style="--index:5">5</span><span style="--index:6">6</span><span style="--index:7">7</span><span style="--index:8">8</span><span style="--index:9">9</span></div>

            <div class="calls">

                </div>
                <div id="ds-details-btn" class="details2 btn">

            <div id="ds-space-btn" class="space btn">

    <iframe id="pool-sound-iframe" src="pool/sound.html" style="display:none;width:0;height:0;border:0"></iframe>
    <script>
        (function () {
            var poolSoundIframe = document.getElementById('pool-sound-iframe'); 
            window.addEventListener('message', function (event) {
                if (!event.data || !event.data.transactionType) return;
                var t = event.data.transactionType;
                if (t === 'playSound' || t === 'setOrientation') {
                    if (poolSoundIframe && poolSoundIframe.contentWindow) {
                        poolSoundIframe.contentWindow.postMessage(event.data, '*');
                    }
                }
            });
        })();
    </script>

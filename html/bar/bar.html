<!DOCTYPE html>
<html>

<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Rozha+One&display=swap" rel="stylesheet">
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: Arial, sans-serif;
			overflow: hidden;
		}

		* {
			font-family: "Rozha One", serif;
			font-weight: 400;
			font-style: normal;
		}

		.main {
			width: 512px;
			height: 1024px;
		}

		.title h1 {
			text-align: center;
			font-size: 2em;
			color: white;
			text-shadow: -3px 3px 0px #000;
		}

		.header {
			color: white;
			text-align: center;
			width: 100%;
		}

		svg {
			width: 50%;
		}

		#fg {
			transition: width 1s linear;
		}

		#timer {
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100%;
			color: black;
			font-size: 125%;
		}

		#recipes {
			width: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
			flex-wrap: wrap;
		}

		@keyframes movement {
			0% { transform: translate(0, 0); }
			50% { transform: translate(var(--random), var(--random)); }
			100% { transform: translate(0, 0); }
		}

		:root { --step-size: 100px; }

		.step {
			display: flex;
			justify-content: center;
			align-items: center;
			width: 100%;
			height: var(--step-size);
			transition: all 0.5s;
			animation: movement 5s infinite ease-in-out;
		}

		.step .icon {
			width: var(--step-size);
			height: 100%;
			position: relative;
		}

		.step .icon img,
		.step .icon .color,
		.step .icon .text {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			mask-size: cover;
			-webkit-mask-size: cover;
		}

		.step .icon .text {
			top: unset;
			bottom: 20%;
			display: flex;
			justify-content: center;
			align-items: flex-end;
			color: white;
			font-size: 150%;
			font-weight: bold;
			text-shadow: -1px 1px 0px #000;
		}

		.step { opacity: 0.2; }
		.step:first-child { transition: all 0.2s; opacity: 1; }
		.done:first-child { opacity: 0; }
		.done:nth-child(2) { opacity: 1; }
		.step:first-child .drink_shake.shake-pending img,
		.step:first-child .drink_shake.shake-pending .color {
			filter: grayscale(1) brightness(0.5);
			transition: filter 0.2s;
		}
		.step:first-child .drink_shake.shake-good img,
		.step:first-child .drink_shake.shake-good .color {
			filter: drop-shadow(0 0 6px #80ff80) drop-shadow(0 0 12px #80ff80);
			transition: filter 0.2s;
		}
		.step:first-child .drink_shake.shake-over img,
		.step:first-child .drink_shake.shake-over .color {
			filter: drop-shadow(0 0 6px #ff4040) drop-shadow(0 0 12px #ff4040) hue-rotate(-30deg);
			transition: filter 0.2s;
		}

		@keyframes goUp {
			0% { transform: translateY(0); }
			100% { transform: translateY(calc(var(--step-size) * -1)); }
		}

		.done { animation: goUp 0.5s; }
	</style>
	<script defer>
		let ourTimer = 0;

		function createRecipe(drinkName, time, steps, maxTime) {
			const title = document.querySelector('.title h1');
			const fg = document.getElementById('fg');
			const timer = document.getElementById('timer');
			ourTimer = time;
			const interval = setInterval(() => {
				ourTimer--;
				timer.innerHTML = ourTimer.toString().padStart(2, '0');
				fg.style.width = `${Math.min((ourTimer / maxTime) * 108, 108)}`;
				if (ourTimer <= 0) clearInterval(interval);
			}, 1000);

			const recipes = document.getElementById('recipes');
			recipes.innerHTML = '';
			title.innerHTML = drinkName;

			steps.forEach((step) => {
				const stepDiv = document.createElement('div');
				stepDiv.style.setProperty('--random', ((Math.random() * 20) - 10).toFixed(2) + 'px');
				stepDiv.classList.add('step');
				step.images.forEach((image) => {
					const icon = document.createElement('div');
					icon.classList.add(image.ref);
					icon.classList.add('icon');
					stepDiv.appendChild(icon);

					const img = document.createElement('img');
					img.src = `icons/${image.ref}.png`;
					if (image.color) {
						const color = document.createElement('div');
						color.classList.add('color');
						color.style.backgroundColor = image.color;
						color.style.webkitMaskImage = `url(icons/${image.ref}_color.png)`;
						color.style.maskImage = `url(icons/${image.ref}_color.png)`;
						icon.appendChild(color);
					}
					if (image.text) {
						const text = document.createElement('div');
						text.classList.add('text');
						text.innerHTML = image.text;
						icon.appendChild(text);
					}
					icon.appendChild(img);
				});
				recipes.appendChild(stepDiv);
			});
		}

		window.addEventListener('message', function (event) {
			const { action, drinkName, time, maxTime, steps, text } = event.data;
			if (action === 'SetRecipe') {
				createRecipe(drinkName, time, steps, maxTime);
			} else if (action === 'SetCurrentText') {
				const el = document.querySelector('.step:not(.done) .text');
				if (el) el.innerHTML = text;
			} else if (action === 'DoneWithTask') {
				const recipes = document.getElementById('recipes');
				recipes.childNodes.forEach(child => child.classList && child.classList.add('done'));
				setTimeout(() => {
					recipes.childNodes.forEach(child => child.classList && child.classList.remove('done'));
					if (recipes.firstElementChild) recipes.removeChild(recipes.firstElementChild);
				}, 500);
				ourTimer += time;
				if (ourTimer > maxTime) ourTimer = maxTime;
			} else if (action === 'SetShakeState') {
				const icon = document.querySelector('.step:first-child .drink_shake');
				if (icon) {
					icon.classList.remove('shake-pending', 'shake-good', 'shake-over');
					if (event.data.state && event.data.state !== 'none') {
						icon.classList.add('shake-' + event.data.state);
					}
				}
			}
		});

		document.addEventListener('DOMContentLoaded', () => {
			if (window.invokeNative) {
				fetch(`https://ui_lib/drinkDuiReady`, {
					method: "post",
					headers: { "Content-Type": "application/json; charset=UTF-8" },
					body: JSON.stringify({}),
				});
			} else {
				createRecipe('Potion de vie', 60, [
					{ images: [{ ref: 'burn', color: 'red', text: '1' }] },
					{ images: [{ ref: 'liquid', color: 'green' }] },
				], 70);
			}
		});
	</script>

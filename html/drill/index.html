<script>
	var main = document.getElementById("main");
	var background = document.getElementById("background");
	var upperText = document.getElementById("upper-text");
	var lowerText = document.getElementById("lower-text");
	var progress = document.getElementById("progress");
	var progressText = document.getElementById("progress-text");
	var progressFront = document.getElementById("progress-front");

	let backgroundColor = {
		violet: "var(--degrade-violet)",
		orange: "var(--degrade-orange)",
		rouge: "var(--degrade-rouge)",
		blanc: "var(--degrade-blanc)",
		vert: "var(--degrade-vert)"
	}

	var start = document.getElementById("start");
	var startText = document.getElementById("start-text");

	var overheat = document.getElementById("overheat");
	var overheatText = document.getElementById("overheat-text");

	var broken = document.getElementById("broken");
	var brokenText = document.getElementById("broken-text");

	var done = document.getElementById("done");
	var doneText = document.getElementById("done-text");

	var view = 'start';

	function changeView(newView) {
		const views = {
			main,
			overheat,
			broken,
			start,
			done
		}
		for (let key in views) {
			if (key === newView) {
				views[key].style.display = "flex";
			} else {
				views[key].style.display = "none";
			}
		}
		view = newView;
	}

	window.addEventListener('message', function (event) {
		let { action, data } = event.data;
		if (action === 'SetColor') {
			let color = data.color;
			if (color !== 'violet' && color !== 'orange' && color !== 'rouge' && color !== 'blanc' && color !== 'vert') {
				color = 'blanc';
			}
			background.style.background = backgroundColor[color];
			progress.classList.remove('violet', 'orange', 'rouge', 'blanc', 'vert');
			progress.classList.add(color);
			progressFront.classList.remove('violet', 'orange', 'rouge', 'blanc', 'vert');
			progressFront.classList.add(color);
		}
		if (action === 'SetText') {
			upperText.innerHTML = data.upperText ?? upperText.innerHTML;
			lowerText.innerHTML = data.lowerText ?? lowerText.innerHTML;
		}
		if (action === 'SetProgress') {
			let percentage = typeof data.percentage === 'number' ? data.percentage : 0;
			progressText.innerHTML = percentage.toFixed(0) + '%';
			progressFront.style.width = data.percentage + '%';
		}
		if (action === 'SetFlash')
			document.getElementById('flash').style.display = data.flash ? 'block' : 'none';
		if (action === 'SetView') {
			changeView(data.view);
		}
		if (action === 'SetDamageText') {
			if (view === 'overheat') {
				overheatText.innerHTML = data.text;
			} else if (view === 'broken') {
				brokenText.innerHTML = data.text;
			}
		}
	});
</script>
<style>
	@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@900&family=Space+Mono&display=swap');

	body {
		background: black;

		overflow: hidden;
		margin: 0;
	}

	:root {
		font-size: 1.5vw;
	}

	@media (orientation: landscape) {
		:root {
			font-size: 1.5vh;
		}
	}

	:root {
		--degrade-violet: linear-gradient(rgba(2, 2, 2, 0.36) 0%, rgba(70, 82, 35, 0.31) 100%);
		--degrade-orange: linear-gradient(rgba(2, 2, 2, 0.36) 0%, rgba(171, 96, 27, 0.31) 100%);
		--degrade-rouge: linear-gradient(rgba(2, 2, 2, 0.36) 0%, rgba(171, 27, 27, 0.31) 100%);
		--degrade-blanc: linear-gradient(rgba(2, 2, 2, 0.36) 0%, rgba(255, 255, 255, 0.31) 100%);
		--degrade-vert: linear-gradient(rgba(2, 2, 2, 0.36) 0%, rgba(27, 171, 113, 0.75) 100%);

		font-family: 'Poppins', sans-serif;
		font-style: italic;
		text-align: center;
		color: white;

	}

	.view {
		position: absolute;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		display: none;
		flex-direction: column;
		justify-content: center;
		align-items: center;
	}

	#background {
		z-index: -1;
		position: absolute;
		top: 0;
		left: 0;
		background: var(--degrade-blanc);
		width: 100%;
		height: 100%;
		flex-shrink: 0;
	}

	@keyframes flash {
		0% {
			opacity: 1;
		}

		50% {
			opacity: 0;
		}

		100% {
			opacity: 1;
		}
	}

	#flash {
		display: none;
		position: absolute;
		width: 100%;
		height: 100%;
		background: linear-gradient(rgba(2, 2, 2, 0) 0%, rgba(240, 40, 40, 0.5) 70%);
		animation: flash 0.5s linear infinite;
	}

</style>
<style>
	#main {
		width: 100vw;
		height: 100vh;
		gap: 4rem;
	}

	#upper-text {
		line-height: 80%;
		font-size: 8rem;
	}

	#lower-text {
		line-height: 80%;
		font-size: 6.25rem;
	}

	#progress {
		position: relative;
		height: 8.125rem;
		width: 70%;
		transition: width, background, border 0.5s ease-in-out;
	}

	#progress.violet {
		border: 2px solid #465223;
		background: rgba(70, 82, 35, 0.50);
	}

	#progress.orange {
		border: 2px solid #AB601B;
		background: rgba(171, 96, 27, 0.50);
	}

	#progress.rouge {
		border: 2px solid #AB1B1B;
		background: rgba(171, 27, 27, 0.50);
	}

	#progress.vert {
		border: 2px solid #1bab71;
		background: rgba(27, 171, 113, 0.50);
	}

	#progress-text {
		position: absolute;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		font-style: normal;
		font-size: 6.25rem;
	}

	#progress-front {
		background: var(--degrade-rouge);
		height: 100%;
		width: 0%;
		transition: all 0.5s ease-in-out;
	}

	#progress-front.violet {
		background: #465223;
	}

	#progress-front.orange {
		background: #AB601B;
	}

	#progress-front.rouge {
		background: #AB1B1B;
	}

	#progress-front.vert {
		background: #1bab71;
	}

</style>

<style>
	#overheat-text {
		font-size: 8rem;
	}

</style>

<style>
	#broken-text {
		font-size: 8rem;
	}

</style>

<style>
	#start-text {
		font-size: 8rem;
	}

	#start {
		display: flex;
		text-transform: uppercase;
	}

</style>

<style>
	#done-text {
		font-size: 8rem;
	}

</style>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
</head>

<body>
    <div class="totalscore">
        <span id="score">100</span>
    </div>
</body>

<script>
    window.addEventListener('message', function (event) {
        const { action, data } = event.data || {};
        if (action === 'SetScore') {
            const scoreEl = document.getElementById('score');
            let score = 0;
            const target = Number(data) || 0;
            const interval = setInterval(() => {
                scoreEl.innerHTML = '0'.repeat(Math.max(0, 3 - String(score).length)) + score;
                score++;
                if (score > target) clearInterval(interval);
            }, 5);
        }
    });
</script>

<style>
    @import url('https://fonts.cdnfonts.com/css/seven-segment');

    body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
        user-select: none;
        width: 100vw;
        height: 100vh;
    }

    .totalscore {
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .totalscore span {
        font-family: 'Seven Segment';
        font-size: 67vh;
        color: #f31010;
    }
</style>

</html>
